[project]
name = "mia-single-faktory"
description = "Fast Pool whitehat-MEV settle of the CCD014 MIA burn-to-exit offer book, recycling the below-par arb MIA into a single-sided MIA/sBTC pool on fak.fun."
authors = []
telemetry = false
cache_dir = "./.cache"

requirements = [
    { contract_id = 'SP2PABAF9FTAJYNFZH93XENAJ8FVY99RRM50D2JG9.ccd013-burn-to-exit-mia' },
    { contract_id = 'SM3VDXK3WZZSA84XXFKAFAF15NNZX32CTSG82JFQ4.sbtc-token' },
    { contract_id = 'SP1H1733V5MZ3SZ9XRW9FKYGEZT0JDGEB8Y634C7R.miamicoin-token-v2' },
    { contract_id = 'SP466FNC0P7JWTNM2R9T199QRZN1MYEDTAR0KP27.miamicoin-token' },
    { contract_id = 'SP2ZNGJ85ENDY6QRHQ5P2D4FXKGZWCKTB2T0Z55KS.charisma-traits-v1' },
    { contract_id = 'SP2ZNGJ85ENDY6QRHQ5P2D4FXKGZWCKTB2T0Z55KS.dexterity-traits-v0' },
    # mia-arb-faktory legs: deployed orderbook + ALEX pool 16 + Bitflow xyk + Velar univ2
    { contract_id = 'SPV9K21TBFAK4KNRJXF5DFP8N7W46G4V9RCJDC22.mia-orderbook-faktory' },
    { contract_id = 'SP102V8P0F7JX67ARQ77WEA3D3CFB5XW39REDT0AM.amm-pool-v2-01' },
    { contract_id = 'SP102V8P0F7JX67ARQ77WEA3D3CFB5XW39REDT0AM.token-wstx-v2' },
    { contract_id = 'SP102V8P0F7JX67ARQ77WEA3D3CFB5XW39REDT0AM.token-wmia' },
    { contract_id = 'SM1793C4R5PZ4NS4VQ4WMP7SKKYVH8JZEWSZ9HCCR.xyk-core-v-1-2' },
    { contract_id = 'SM1793C4R5PZ4NS4VQ4WMP7SKKYVH8JZEWSZ9HCCR.xyk-pool-sbtc-stx-v-1-1' },
    { contract_id = 'SM1793C4R5PZ4NS4VQ4WMP7SKKYVH8JZEWSZ9HCCR.token-stx-v-1-2' },
    { contract_id = 'SP20X3DC5R091J8B6YPQT638J8NR1W83KN6TN5BJY.univ2-pool-v1_0_0-0070' },
    { contract_id = 'SP20X3DC5R091J8B6YPQT638J8NR1W83KN6TN5BJY.univ2-fees-v1_0_0-0070' },
    { contract_id = 'SP1Y5YSTAHZ88XYK1VPDH24GY0HPX5J4JECTMY4A1.wstx' },
    { contract_id = 'SM1FKXGNZJWSTWDWXQZJNF7B5TV5ZB235JTCXYXKD.dlmm-swap-router-v-1-2' },
    { contract_id = 'SM1FKXGNZJWSTWDWXQZJNF7B5TV5ZB235JTCXYXKD.dlmm-pool-stx-sbtc-v-1-bps-15' },
    # stx-to-stx-wrapper drives the DEPLOYED machine + fair book
    { contract_id = 'SPV9K21TBFAK4KNRJXF5DFP8N7W46G4V9RCJDC22.mia-fair-faktory-v2' },
    { contract_id = 'SPV9K21TBFAK4KNRJXF5DFP8N7W46G4V9RCJDC22.stx-to-stx-mia-faktory' },
]

# ---------------------------------------------------------------------------
# Standalone set (step 3 drafts, uncommitted). Deploy under SPV9K21 on mainnet;
# the sibling cross-calls (mia-sbtc-pool / mia-single-faktory) resolve there.
# ---------------------------------------------------------------------------
[contracts.mia-pool-faktory]
path = "contracts/mia-pool-faktory.clar"
clarity_version = 6
epoch = "4.0"

[contracts.mia-single-faktory]
path = "contracts/mia-single-faktory.clar"
clarity_version = 6
epoch = "4.0"

[contracts.mia-fair-faktory]
path = "contracts/mia-fair-faktory.clar"
clarity_version = 6
epoch = "4.0"

# v2: frontier partial fill in settle-offers; pool is reused as-is, so only
# the two cross-referencing contracts get a v2 (single's DEPOSITOR -> fair-v2,
# fair's SINGLE_SIDED -> single-v2).
[contracts.mia-single-faktory-v2]
path = "contracts/mia-single-faktory-v2.clar"
clarity_version = 6
epoch = "4.0"

[contracts.mia-fair-faktory-v2]
path = "contracts/mia-fair-faktory-v2.clar"
clarity_version = 6
epoch = "4.0"

# wrapper for whitehat settlers ("Miami to Miami"): one tx = ccd013
# redeem-mia (MIA -> STX at par) + fair-v2 settle-offers (STX -> par-equiv
# MIA); holds no funds, redeems only what the live book needs.
[contracts.mia-to-mia-faktory]
path = "contracts/mia-to-mia-faktory.clar"
clarity_version = 6
epoch = "4.0"

# the STX-capital mirror of mia-to-mia ("first fill the book, then claim
# STX"): settle leg keeps the par-equiv MIA, redeem leg burns it back to STX.
[contracts.stx-to-stx-mia-faktory]
path = "contracts/stx-to-stx-mia-faktory.clar"
clarity_version = 6
epoch = "4.0"

# v2 of the machine: operator allowlist (admin + SP21..FFP rewards), atomic
# run() loop with withdraw-to-caller, settle budget capped by live ccd013
# redemption headroom (no stranding against a dry treasury).
[contracts.stx-to-stx-mia-faktory-v2]
path = "contracts/stx-to-stx-mia-faktory-v2.clar"
clarity_version = 5
epoch = "4.0"

# one-tx v1->v2 closer: churn old machine + withdraw its STX (FASTPOOL
# only) + run-loops on v2 with recovered + extra capital.
[contracts.stx-to-stx-migrate]
path = "contracts/stx-to-stx-migrate.clar"
clarity_version = 5
epoch = "4.0"

# jing orderbook: mia-fair-v2 minus the par machinery — plain 50-deep MIA v2
# sell book priced in sBTC, admin-settable min deposit, settler keeps all.
[contracts.mia-orderbook-jing]
path = "contracts/mia-orderbook-jing.clar"
clarity_version = 6
epoch = "4.0"

# atomic taker arb: buy cheap MIA off the deployed orderbook with sBTC, sell
# MIA->STX on ALEX pool 16, close STX->sBTC on Bitflow (or Velar). Caller
# fronts the sBTC and keeps all proceeds; reverts unless profitable.
[contracts.mia-arb-faktory]
path = "contracts/mia-arb-faktory.clar"
clarity_version = 6
epoch = "4.0"

[contracts.stx-to-stx-wrapper]
path = "contracts/stx-to-stx-wrapper.clar"
clarity_version = 5
epoch = "4.0"

# cycle runbook bundle: one tx = ccd013 redeem-mia on the CALLER's own leftover
# MIA (burning first shrinks the treasury below the 17,100 STX per-pass
# ceiling) + stx-to-stx-mia-faktory-v2 run-loops at a pinned cap. No custody,
# no as-contract - tx-sender flows through both legs.
[contracts.mia-burn-and-run]
path = "contracts/mia-burn-and-run.clar"
clarity_version = 6
epoch = "4.0"

# NOTE: contracts/reference/*.clar are unmodified on-chain copies kept ONLY for
# side-by-side diffing. They call mainnet contracts not in requirements, so they
# are intentionally excluded from the build.

[repl.analysis]
passes = ["check_checker"]

[repl.analysis.check_checker]
strict = false
trusted_sender = false
trusted_caller = false
callee_filter = false
